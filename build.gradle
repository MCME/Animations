plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'com.diffplug.spotless' version "8.4.0"
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

group = 'com.ivan1pl'
version = '1.5'

repositories {
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    implementation 'com.mcmiddleearth:PluginUtils:1.9.1'
}

// https://docs.gradle.org/current/dsl/org.gradle.api.plugins.JavaPluginExtension.html
def targetJavaVersion = 21
java {
    toolchain {
        // Intellij should pick this up
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

processResources {
    filesMatching(['plugin.yml', 'config.yml']) {
        expand(name: project.name, version: project.version)
    }
}

// Replace the normal gradle build with shadowJar
// prevents the non fat JAR from ever being built
jar {
    enabled = false
}

shadowJar {
    archiveClassifier = "" // Removes -all from the end of the generated JAR
}

tasks {
    runServer {
        minecraftVersion("1.21.4")
    }
}

spotless {
    java {
        palantirJavaFormat()
    }
}
